<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>NovaModelsIA</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4fb5"/>
      <stop offset="1" stop-color="#0d1230"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="512" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c8cff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b3c4ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="430" fill="url(#halo)"/>

  <!-- Red neuronal: líneas al centro y anillo entre los nodos -->
  <g fill="none" stroke="#8fa6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="14">
    <path d="M512 512 L262 262 M512 512 L762 262 M512 512 L262 762 M512 512 L762 762" stroke-opacity=".6"/>
    <path d="M262 262 L762 262 L762 762 L262 762 Z" stroke-opacity=".28"/>
  </g>

  <!-- Estrella nova de cuatro puntas, con resplandor -->
  <path id="s" d="M512 176 Q582 442 848 512 Q582 582 512 848 Q442 582 176 512 Q442 442 512 176 Z"
        fill="#7f9bff" filter="url(#glow)"/>
  <path d="M512 176 Q582 442 848 512 Q582 582 512 848 Q442 582 176 512 Q442 442 512 176 Z" fill="url(#star)"/>

  <!-- Nodos -->
  <g fill="#6c8cff" stroke="#ffffff" stroke-width="12">
    <circle cx="262" cy="262" r="46"/>
    <circle cx="762" cy="262" r="46"/>
    <circle cx="262" cy="762" r="46"/>
    <circle cx="762" cy="762" r="46"/>
  </g>
</svg>
